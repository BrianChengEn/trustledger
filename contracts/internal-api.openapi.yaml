openapi: 3.1.0
info:
  title: TrustLedger Internal API
  version: 0.3.0-mvp
  description: >-
    Team-owned React-to-FastAPI contract for the Technica 2026 B2C MVP.
    This is not a Capital One, Jev, or Backboard schema.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Safe readiness status. Never includes keys or upstream bodies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/transactions:
    get:
      operationId: listTransactions
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Canonical transactions for the current demo user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
  /api/v1/analyses:
    post:
      operationId: analyzeTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transaction_id]
              properties:
                transaction_id: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Rules result plus optional Jev result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analysis' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Alerts for the current demo user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
  /api/v1/privacy/preview/{transaction_id}:
    get:
      operationId: previewPrivacyPayload
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Exact safe payload and transformation explanation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/transactions/{transaction_id}/explanation:
    post:
      operationId: explainTransaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: >-
            Plain-language explanation of the current rules alert.
            Gemini is called only when configured and does not change the alert.
            explanation_mode distinguishes a live Gemini reply, a rules template,
            and a rules fallback after a failed Gemini call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/alerts/{alert_id}/confirmations:
    post:
      operationId: confirmAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, consent_to_memory]
              properties:
                decision:
                  type: string
                  enum: [normal, review]
                consent_to_memory:
                  type: boolean
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Confirmation outcome and memory write status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Confirmation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflicting or duplicate confirmation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/memories:
    get:
      operationId: listMemories
      responses:
        '502':
          $ref: '#/components/responses/NessieUnavailable'
        '200':
          description: Sanitized summaries only.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemorySummary' }
  /api/v1/memories/{memory_id}:
    delete:
      operationId: deleteMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Remote memory deletion failed; local memory is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/admin/nessie/query:
    post:
      operationId: queryNessie
      tags:
      - local-admin
      description: Query by server-issued local codes. Display only allowlisted de-identified
        fields. Persist status/time metadata only; never persist raw responses.
      responses:
        '200':
          description: Completed local operation; query envelopes retain the actual
            upstream status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminExecution'
        '403':
          description: Safe local error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Safe local error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Safe local error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Safe local error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Safe local error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Safe local error
          content:
            application/json:
              schema:
