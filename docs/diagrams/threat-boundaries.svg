<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1070" viewBox="0 0 1100 1070" role="img" aria-label="信任邊界與資料出口"><title>信任邊界與資料出口</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#738298"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#192d46}.title{font-size:25px;font-weight:650}.sub{font-size:18px;fill:#52667e}.label{font-size:18px;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}.lane{font-size:17px;letter-spacing:2px;fill:#52667e}</style><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="30" width="1040" height="150" rx="22" fill="#f1f4f8" fill-opacity=".5" stroke="#57677e" stroke-opacity=".18"/><text x="54" y="62" class="lane">邊界 0 · 使用者裝置</text><g><rect x="60" y="83" width="970" height="76" rx="16" fill="#f1f4f8" stroke="#57677e" stroke-opacity=".25"/><rect x="60" y="103" width="4" height="36" rx="2" fill="#57677e"/><text x="82" y="121" class="title">Browser / React</text><text x="82" y="149" class="sub">public config；無 vendor keys；只接受必要 DTO</text></g><rect x="30" y="235" width="1040" height="430" rx="22" fill="#eef5ff" fill-opacity=".5" stroke="#2563eb" stroke-opacity=".18"/><text x="54" y="267" class="lane">邊界 1 · TrustLedger 後端</text><g><rect x="60" y="300" width="450" height="115" rx="16" fill="#eef5ff" stroke="#2563eb" stroke-opacity=".25"/><rect x="60" y="320" width="4" height="75" rx="2" fill="#2563eb"/><text x="82" y="338" class="title">FastAPI + server identity</text><text x="82" y="366" class="sub">驗證、owner 檢查、限制 request size</text></g><g><rect x="600" y="300" width="430" height="115" rx="16" fill="#fff7e8" stroke="#b57114" stroke-opacity=".25"/><rect x="600" y="320" width="4" height="75" rx="2" fill="#b57114"/><text x="622" y="338" class="title">Runtime secrets</text><text x="622" y="366" class="sub">僅後端環境；最小權限</text></g><g><rect x="60" y="490" width="450" height="115" rx="16" fill="#e9faf5" stroke="#087f6b" stroke-opacity=".25"/><rect x="60" y="510" width="4" height="75" rx="2" fill="#087f6b"/><text x="82" y="528" class="title">Privacy &amp; consent gate</text><text x="82" y="556" class="sub">白名單、PII redaction、記憶 opt-in</text></g><g><rect x="600" y="490" width="430" height="115" rx="16" fill="#f1f4f8" stroke="#57677e" stroke-opacity=".25"/><rect x="600" y="510" width="4" height="75" rx="2" fill="#57677e"/><text x="622" y="528" class="title">資料與日誌</text><text x="622" y="556" class="sub">單一合成 demo user；無 PII 日誌</text></g><path d="M285 159V300" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><text x="285" y="217" class="label" text-anchor="middle">HTTPS；明確 CORS</text><path d="M600 355H510" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M285 415V490" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M510 548H600" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><rect x="30" y="740" width="320" height="270" rx="22" fill="#f3efff" fill-opacity=".5" stroke="#7352be" stroke-opacity=".18"/><text x="54" y="772" class="lane">邊界 2 · sandbox</text><rect x="390" y="740" width="320" height="270" rx="22" fill="#f3efff" fill-opacity=".5" stroke="#7352be" stroke-opacity=".18"/><text x="414" y="772" class="lane">邊界 3 · AI</text><rect x="750" y="740" width="320" height="270" rx="22" fill="#f1f4f8" fill-opacity=".5" stroke="#57677e" stroke-opacity=".18"/><text x="774" y="772" class="lane">邊界 4 · delivery</text><g><rect x="53" y="806" width="274" height="136" rx="16" fill="#f3efff" stroke="#7352be" stroke-opacity=".25"/><rect x="53" y="826" width="4" height="96" rx="2" fill="#7352be"/><text x="75" y="844" class="title">Nessie</text><text x="75" y="872" class="sub">query key 不進 logs</text><text x="75" y="897" class="sub">不是真實銀行資料</text></g><g><rect x="413" y="806" width="274" height="136" rx="16" fill="#f3efff" stroke="#7352be" stroke-opacity=".25"/><rect x="413" y="826" width="4" height="96" rx="2" fill="#7352be"/><text x="435" y="844" class="title">Jev / Backboard</text><text x="435" y="872" class="sub">最小化特徵 / 抽象事實</text><text x="435" y="897" class="sub">使用者隔離、刪除與保留</text></g><g><rect x="773" y="806" width="274" height="136" rx="16" fill="#f1f4f8" stroke="#57677e" stroke-opacity=".25"/><rect x="773" y="826" width="4" height="96" rx="2" fill="#57677e"/><text x="795" y="844" class="title">GitHub / CI</text><text x="795" y="872" class="sub">無 key 的 mock tests</text><text x="795" y="897" class="sub">PR review → HTTPS host</text></g><path d="M190 665V806" fill="none" stroke="#738298" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="190" y="710" class="label" text-anchor="middle">後端 HTTP client</text><path d="M510 595H550V806" fill="none" stroke="#738298" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="550" y="710" class="label" text-anchor="middle">safe features / consent</text><path d="M920 806V665" fill="none" stroke="#738298" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="920" y="710" class="label" text-anchor="middle">reviewed artifact</text></svg>