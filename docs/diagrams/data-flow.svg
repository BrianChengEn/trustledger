<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1070" viewBox="0 0 1100 1070" role="img" aria-label="資料最小化流程"><title>資料最小化流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#738298"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#192d46}.title{font-size:25px;font-weight:650}.sub{font-size:18px;fill:#52667e}.label{font-size:18px;paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}.lane{font-size:17px;letter-spacing:2px;fill:#52667e}</style><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="30" width="540" height="1010" rx="22" fill="#eef5ff" fill-opacity=".5" stroke="#2563eb" stroke-opacity=".18"/><text x="54" y="62" class="lane">後端轉換 · 每一步可測試</text><rect x="610" y="30" width="460" height="1010" rx="22" fill="#e9faf5" fill-opacity=".5" stroke="#087f6b" stroke-opacity=".18"/><text x="634" y="62" class="lane">輸出與人工控制</text><path d="M300 208V257" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M300 365V415" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M300 523V573" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M300 681V731" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M300 839V889" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M535 785H650" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><text x="595" y="761" class="label" text-anchor="middle">實際同一份 payload</text><path d="M535 943H650" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><path d="M840 558V620" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><text x="840" y="594" class="label" text-anchor="middle">明確決定 + opt-in</text><path d="M840 728V790" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><text x="840" y="767" class="label" text-anchor="middle">只有政策允許</text><g><rect x="65" y="100" width="470" height="108" rx="16" fill="#f1f4f8" stroke="#57677e" stroke-opacity=".25"/><rect x="65" y="120" width="4" height="68" rx="2" fill="#57677e"/><text x="87" y="138" class="title">01 讀取 sandbox / fixture</text><text x="87" y="166" class="sub">原始值限後端 request scope</text></g><g><rect x="65" y="257" width="470" height="108" rx="16" fill="#eef5ff" stroke="#2563eb" stroke-opacity=".25"/><rect x="65" y="277" width="4" height="68" rx="2" fill="#2563eb"/><text x="87" y="295" class="title">02 Canonical transaction</text><text x="87" y="323" class="sub">驗證型別、tokenize raw IDs</text></g><g><rect x="65" y="415" width="470" height="108" rx="16" fill="#eef5ff" stroke="#2563eb" stroke-opacity=".25"/><rect x="65" y="435" width="4" height="68" rx="2" fill="#2563eb"/><text x="87" y="453" class="title">03 白名單建構</text><text x="87" y="481" class="sub">未知欄位不複製；不採刪除式過濾</text></g><g><rect x="65" y="573" width="470" height="108" rx="16" fill="#e9faf5" stroke="#087f6b" stroke-opacity=".25"/><rect x="65" y="593" width="4" height="68" rx="2" fill="#087f6b"/><text x="87" y="611" class="title">04 檢查與分桶</text><text x="87" y="639" class="sub">PII / key 拒絕；金額、時間泛化</text></g><g><rect x="65" y="731" width="470" height="108" rx="16" fill="#e9faf5" stroke="#087f6b" stroke-opacity=".25"/><rect x="65" y="751" width="4" height="68" rx="2" fill="#087f6b"/><text x="87" y="769" class="title">05 safe-ai-payload-v1</text><text x="87" y="797" class="sub">僅 8 個核准的非原始交易特徵</text></g><g><rect x="65" y="889" width="470" height="108" rx="16" fill="#eef5ff" stroke="#2563eb" stroke-opacity=".25"/><rect x="65" y="909" width="4" height="68" rx="2" fill="#2563eb"/><text x="87" y="927" class="title">06 Rules + optional Jev</text><text x="87" y="955" class="sub">輸出可解釋警示；timeout 可降級</text></g><g><rect x="650" y="110" width="380" height="120" rx="16" fill="#e9faf5" stroke="#087f6b" stroke-opacity=".25"/><rect x="650" y="130" width="4" height="80" rx="2" fill="#087f6b"/><text x="672" y="148" class="title">Privacy Inspector</text><text x="672" y="176" class="sub">顯示欄位動作與送出的安全內容</text></g><g><rect x="650" y="438" width="380" height="120" rx="16" fill="#fff7e8" stroke="#b57114" stroke-opacity=".25"/><rect x="650" y="458" width="4" height="80" rx="2" fill="#b57114"/><text x="672" y="476" class="title">使用者確認</text><text x="672" y="504" class="sub">normal / review；不自動移動資金</text></g><g><rect x="650" y="620" width="380" height="108" rx="16" fill="#fff7e8" stroke="#b57114" stroke-opacity=".25"/><rect x="650" y="640" width="4" height="68" rx="2" fill="#b57114"/><text x="672" y="658" class="title">Memory write gate</text><text x="672" y="686" class="sub">明確同意 + policy + owner 檢查</text></g><g><rect x="650" y="790" width="380" height="108" rx="16" fill="#f3efff" stroke="#7352be" stroke-opacity=".25"/><rect x="650" y="810" width="4" height="68" rx="2" fill="#7352be"/><text x="672" y="828" class="title">Backboard 記憶</text><text x="672" y="856" class="sub">僅抽象事實；可列出、可刪除</text></g><path d="M840 230V315H590V490H650" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><text x="805" y="332" class="label" text-anchor="middle">回到交易與警示</text><path d="M840 898V952" fill="none" stroke="#738298" stroke-width="2"  marker-end="url(#arrow)"/><text x="840" y="933" class="label" text-anchor="middle">未同意：不寫入</text><text x="840" y="987" class="sub" text-anchor="middle">無 PII 日誌 · 不記錄 request body</text></svg>