# Bootstrap only AFTER network/public-exposure approval. No application is served.
server {
    listen 80;
    server_name 35.227.39.10;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 404; }
}
